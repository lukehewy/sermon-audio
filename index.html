<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>主日讲道 · 生命之道基督教会</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:#f6f3ec; color:#222; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 24px; text-align:center; margin: 10px 0 2px; }
  .sub { text-align:center; color:#777; font-size:15px; margin-bottom: 22px; }
  .card { background:#fff; border-radius:16px; padding:22px 18px; box-shadow:0 2px 10px rgba(0,0,0,.08); margin-bottom:20px; }
  .date { font-size:20px; font-weight:700; text-align:center; margin: 2px 0 6px; }
  .note { text-align:center; color:#666; font-size:15px; margin-bottom:16px; }
  .bigbtn { display:block; text-align:center; background:#1a7f37; color:#fff; font-size:24px; font-weight:700;
            padding:20px 10px; border-radius:14px; text-decoration:none; }
  .bigbtn:active { background:#146c2e; }
  .steps { font-size:18px; line-height:1.65; }
  .steps h2 { font-size:20px; margin: 4px 0 10px; }
  .steps ol { margin:0; padding-left: 26px; }
  .steps li { margin-bottom: 10px; }
  .old h2 { font-size:20px; margin: 4px 0 10px; }
  .old a { display:block; font-size:19px; color:#1a7f37; text-decoration:none; padding:14px 4px; border-top:1px solid #eee; }
  .foot { text-align:center; color:#999; font-size:14px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>主日讲道</h1>
  <div class="sub">生命之道基督教会 · 每周一上午更新</div>

  <div class="card">
    <div class="date">最新一讲：10月25日（主日）</div>
    <div class="note">点下面绿色大按钮，就能把讲道存进手机</div>
    <!-- LATEST_LINK -->
    <a class="bigbtn" href="https://github.com/lukehewy/sermon-audio/releases/download/2026-10-25/sermon-2026-10-25.mp3">⬇ 点这里下载讲道</a>
  </div>

  <div class="card steps">
    <h2>下载以后，怎么找、怎么转发</h2>
    <ol>
      <li>点上面的绿色大按钮，等它下载完。</li>
      <li>打开手机上的「文件」App（蓝色文件夹图标），点下面的「浏览」，再点「下载」。</li>
      <li>最上面那个带日期的文件就是讲道，点它就能听。</li>
      <li>要转发给别人：点文件右边的「分享」按钮（方框带箭头），选「微信」，再选要发的人，就发出去了。</li>
    </ol>
  </div>

  <div class="card old">
    <h2>前几周的讲道</h2>
    <!-- OLD_LINKS -->
    <a href="https://github.com/lukehewy/sermon-audio/releases/download/2026-10-18/sermon-2026-10-18.mp3">⬇ 10月18日（主日）讲道</a>
  </div>

  <div class="foot">找不到的时候，就回到这个页面，点最上面的绿色大按钮。</div>
</div>
</body>
</html>
